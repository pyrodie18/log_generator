[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-generator"
version = "0.1.0"
description = "Deterministic source-neutral log dataset generator."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "log_generator maintainers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
log-generator = "log_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
